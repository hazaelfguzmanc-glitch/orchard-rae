<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nebula Music">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1026"/>
      <stop offset="0.55" stop-color="#170F33"/>
      <stop offset="1" stop-color="#2A0F45"/>
    </linearGradient>
    <linearGradient id="note" x1="0.15" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#57E0FF"/>
      <stop offset="0.5" stop-color="#9C8CFF"/>
      <stop offset="1" stop-color="#E9A8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B7BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57E0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E9A8FF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="117" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- halo de nebulosa -->
  <ellipse cx="256" cy="268" rx="176" ry="152" fill="url(#glow)"/>

  <!-- anillo de nebulosa, abierto -->
  <path d="M392 232 A 146 146 0 1 0 356 372" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>

  <!-- estrellas -->
  <circle cx="404" cy="150" r="7" fill="#BFF4FF" opacity="0.85"/>
  <circle cx="112" cy="196" r="5" fill="#E6D2FF" opacity="0.6"/>
  <circle cx="150" cy="404" r="4" fill="#CFF6FF" opacity="0.45"/>

  <!-- nota: cabeza, asta y bandera -->
  <g>
    <path d="M271 120 C 336 130 396 172 396 234 C 396 196 344 158 271 158 Z" fill="url(#note)"/>
    <rect x="245" y="118" width="27" height="228" rx="13.5" fill="url(#note)"/>
    <ellipse cx="204" cy="352" rx="70" ry="54" transform="rotate(-22 204 352)" fill="url(#note)"/>
    <ellipse cx="188" cy="336" rx="22" ry="16" transform="rotate(-22 188 336)" fill="#FFFFFF" opacity="0.18"/>
  </g>
</svg>
